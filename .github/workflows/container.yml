name: Test and publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild so the image picks up the latest yt-dlp; everything else
  # stays at the versions pinned in requirements.txt.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/gabborges/magna-bot

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Keep in sync with the Dockerfile base image.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # yt-dlp is not pinned; see requirements.in.
        run: pip install -r requirements.txt yt-dlp

      - name: Run tests
        run: python -m unittest -v

  publish:
    needs: test
    # Pull requests only run the tests; images are published from main, tags
    # and the weekly rebuild.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
            # The weekly rebuild overwrites the sha tag of an unchanged commit,
            # so it also gets a dated tag to roll back to.
            type=schedule,prefix=weekly-,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YTDLP_CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
